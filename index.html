<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Kairo</title>

        <link rel="shortcut icon" href="assets/kairo-icon.svg" type="image/x-icon">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="styles/global.css">
        <link rel="stylesheet" href="styles/timer.css">
    </head>

    <body>
        <aside class="sidebar">
            <img src="assets/kairo-logo-lockup.svg" alt="Kairo logo">

            <button type="button" id="toggle-sidebar-btn"><i class="fa-solid fa-circle-chevron-left"></i></button>

            <nav>
                <ul>
                    <li><a href="index.html" data-tooltip="Timer" class="active"><i class="fa-solid fa-stopwatch"></i> <span>Timer</span></a></li>
                    <li><a href="clients.html" data-tooltip="Clientes"><i class="fa-solid fa-user"></i> <span>Clientes</span></a></li>
                    <li><a href="projects.html" data-tooltip="Projetos"><i class="fa-regular fa-clipboard"></i> <span>Projetos</span></a></li>
                    <li><a href="tasks.html" data-tooltip="Tarefas"><i class="fa-solid fa-list-check"></i> <span>Tarefas</span></a></li>
                    <li><a href="reports.html" data-tooltip="Relatórios"><i class="fa-solid fa-file-lines"></i> <span>Relatórios</span></a></li>
                    <li><a href="finance.html" data-tooltip="Financeiro"><i class="fa-solid fa-calculator"></i> <span>Financeiro</span></a></li>
                </ul>
            </nav>

            <button type="button" id="toggle-theme-btn"><i class="fa-solid fa-moon"></i> <span>Modo escuro</span></button>
        </aside>

        <main>
            <h1>Timer</h1>

            <section id="timer">
                <form action="">
                    <div class="form-row form-row-top">
                        <div class="form-group">
                            <label for="timer-description">Descrição</label>
                            <input type="text" id="timer-description" placeholder="Descrição" required>
                        </div>
                        <div class="form-group">
                            <label for="timer-tags"><i class="fa-solid fa-tags"></i> Etiqueta</label>
                            <input type="text" id="timer-tags">
                        </div>
                    </div>

                    <div class="form-row form-row-bottom">
                        <div class="form-group">
                            <label for="timer-client">Cliente</label>
                            <select name="timer-client" id="timer-client" required>...</select>
                        </div>
                        <div class="form-group">
                            <label for="timer-project">Projeto</label>
                            <select name="timer-project" id="timer-project" disabled required>...</select>
                        </div>
                        <div class="form-group">
                            <span class="btn-spacer">&nbsp;</span>
                            <button type="submit" id="start-btn">Iniciar</button>
                        </div>
                    </div>
                </form>

                <div id="timer-running" style="display: none;">
                    <p id="timer-display">00:00:00</p>
                    <button type="button" id="stop-btn">Parar</button>
                </div>
            </section>

            <section id="timer-list">
                <h2>Atividades de hoje</h2>

                <div id="timer-list-items">

                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <ul>
                <li><a href="index.html" class="active"><i class="fa-solid fa-stopwatch"></i></a></li>
                <li><a href="clients.html"><i class="fa-solid fa-user"></i></a></li>
                <li><a href="tasks.html"><i class="fa-solid fa-list-check"></i></a></li>
                <li><a href="reports.html"><i class="fa-solid fa-file-lines"></i></a></li>
                <li><a href="finance.html"><i class="fa-solid fa-calculator"></i></a></li>
                <li><button type="button" id="more-menu-btn"><i class="fa-solid fa-ellipsis"></i></button></li>
            </ul>
            
            <div id="more-menu">
                <a href="projects.html"><i class="fa-regular fa-clipboard"></i></a>
            </div>
        </nav>

        <script src="scripts/storage.js"></script>
        <script src="scripts/timer.js"></script>
    </body>
</html>
