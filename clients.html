<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Kairo</title>

        <link rel="shortcut icon" href="assets/kairo-icon.svg" type="image/x-icon">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="styles/global.css">
        <link rel="stylesheet" href="styles/clients.css">
    </head>

    <body>
        <aside class="sidebar">
            <img src="assets/kairo-logo-lockup.svg" alt="Kairo logo">

            <button type="button" id="toggle-sidebar-btn"><i class="fa-solid fa-circle-chevron-left"></i></button>

            <nav>
                <ul>
                    <li><a href="index.html" data-tooltip="Timer"><i class="fa-solid fa-stopwatch"></i> <span>Timer</span></a></li>
                    <li><a href="clients.html" data-tooltip="Clientes" class="active"><i class="fa-solid fa-user"></i> <span>Clientes</span></a></li>
                    <li><a href="projects.html" data-tooltip="Projetos"><i class="fa-regular fa-clipboard"></i> <span>Projetos</span></a></li>
                    <li><a href="tasks.html" data-tooltip="Tarefas"><i class="fa-solid fa-list-check"></i> <span>Tarefas</span></a></li>
                    <li><a href="reports.html" data-tooltip="Relatórios"><i class="fa-solid fa-file-lines"></i> <span>Relatórios</span></a></li>
                    <li><a href="finance.html" data-tooltip="Financeiro"><i class="fa-solid fa-calculator"></i> <span>Financeiro</span></a></li>
                </ul>
            </nav>

            <button type="button" id="toggle-theme-btn"><i class="fa-solid fa-moon"></i> <span>Modo escuro</span></button>
        </aside>

        <main>
            <h1>Clientes</h1>

            <button type="button" id="new-client-btn">Novo Cliente</button>

            <div id="clients-list">

            </div>

            <dialog id="clients-modal">
                <form action="">
                    <label for="company-name">Empresa</label>
                    <input type="text" name="company-name" id="company-name">

                    <label for="contact-name">Nome do cliente</label>
                    <input type="text" name="contact-name" id="contact-name" required>

                    <label for="charge-type">Tipo de Cobrança</label>
                    <select name="charge-type" id="charge-type">
                        <option value="">Selecione</option>
                        <option value="hourly">Hora</option>
                        <option value="fixed">Fixo</option>
                    </select>

                    <label for="charge-price">Valor</label>
                    <input type="number" name="charge-price" id="charge-price" required>

                    <label for="add-info">Informações Adicionais</label>
                    <textarea name="add-info" id="add-info"></textarea>

                    <input type="file" id="client-attachment" multiple>

                    <button type="submit" class="btn-save">Salvar</button>
                    <button type="button" class="btn-cancel">Cancelar</button>
                    <button type="button" class="btn-delete">Excluir cliente</button>
                </form>
            </dialog>
        </main>
    </body>
</html>
