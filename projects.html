<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Kairo</title>

        <link rel="shortcut icon" href="assets/kairo-icon.svg" type="image/x-icon">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="styles/global.css">
        <link rel="stylesheet" href="styles/projects.css">
    </head>

    <body>
        <aside class="sidebar">
            <img src="assets/kairo-logo-lockup.svg" alt="Kairo logo">

            <button type="button" id="toggle-sidebar-btn"><i class="fa-solid fa-circle-chevron-left"></i></button>

            <nav>
                <ul>
                    <li><a href="index.html" data-tooltip="Timer"><i class="fa-solid fa-stopwatch"></i> <span>Timer</span></a></li>
                    <li><a href="clients.html" data-tooltip="Clientes"><i class="fa-solid fa-user"></i> <span>Clientes</span></a></li>
                    <li><a href="projects.html" data-tooltip="Projetos" class="active"><i class="fa-regular fa-clipboard"></i> <span>Projetos</span></a></li>
                    <li><a href="tasks.html" data-tooltip="Tarefas"><i class="fa-solid fa-list-check"></i> <span>Tarefas</span></a></li>
                    <li><a href="reports.html" data-tooltip="Relatórios"><i class="fa-solid fa-file-lines"></i> <span>Relatórios</span></a></li>
                    <li><a href="finance.html" data-tooltip="Financeiro"><i class="fa-solid fa-calculator"></i> <span>Financeiro</span></a></li>
                </ul>
            </nav>

            <button type="button" id="toggle-theme-btn"><i class="fa-solid fa-moon"></i> <span>Modo escuro</span></button>
        </aside>

        <main>
            <h1>Projetos</h1>

            <button type="button" id="new-project-btn">Novo Projeto</button>

            <div id="projects-list">

            </div>

            <dialog id="projects-modal">
                <form action="">
                    <label for="project-name">Projeto</label>
                    <input type="text" name="project-name" id="project-name" required>

                    <label for="project-color">Personalizar</label>
                    <input type="color" name="project-color" id="project-color">

                    <button type="submit" class="btn-save">Salvar</button>
                    <button type="button" class="btn-cancel">Cancelar</button>
                    <button type="button" class="btn-delete">Excluir projeto</button>
                </form>
            </dialog>
        </main>
    </body>
</html>
